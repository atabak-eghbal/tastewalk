# Pings the public demo so Render's free tier doesn't sleep during judging.
# Set the repo variable DEMO_URL (Settings > Secrets and variables > Actions > Variables).
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        if: ${{ vars.DEMO_URL != '' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.DEMO_URL }}/healthz"
