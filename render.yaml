# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the dashboard.
services:
  - type: web
    name: tastewalk
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_STOPS
        value: "6"
      - key: CACHE_DIR
        value: /tmp/tastewalk-cache
